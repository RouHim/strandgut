  <!-- ═══════════════════════════════════════════════════════════════
       Typography
       ═══════════════════════════════════════════════════════════════ -->
  <text x="290" y="93"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="54" font-weight="700" fill="#e8e0d8"
        letter-spacing="-0.5"
        filter="url(#text-shadow)">
    Strandgut
  </text>

  <text x="290" y="132"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="18" font-weight="400" fill="#8b8078"
        letter-spacing="0.8">
    LAN Service Scanner Dashboard
  </text>

  <!-- ═══════════════════════════════════════════════════════════════
       Accent details
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Horizontal accent bar -->
  <line x1="290" y1="146" x2="455" y2="146" stroke="url(#accent-bar)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small amber dot on the left edge of the glass panel -->
  <circle cx="265" cy="100" r="2.5" fill="#f4a340" opacity="0.6"/>
  <circle cx="265" cy="100" r="5" fill="rgba(244,163,64,0.15)"/>
</svg>
