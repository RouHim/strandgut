  </g>

  <!-- Typography -->
  <text x="210" y="86"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="50" font-weight="700" fill="#e8e0d8"
        letter-spacing="-0.5"
        filter="url(#text-shadow)">
    Strandgut
  </text>

  <text x="210" y="120"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="400" fill="#8b8078"
        letter-spacing="0.6">
    LAN Service Scanner Dashboard
  </text>

  <!-- Accent bar -->
  <line x1="210" y1="140" x2="440" y2="140" stroke="url(#accent-bar)" stroke-width="2" stroke-linecap="round"/>
</svg>
