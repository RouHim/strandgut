<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Background depth — lightens toward icon area -->
    <radialGradient id="bg-depth" cx="12%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0e2838"/>
      <stop offset="55%" stop-color="#0a1e28"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>

    <!-- Warm amber wash, top-right -->
    <radialGradient id="sunset-hint" cx="80%" cy="0%" r="55%">
      <stop offset="0%" stop-color="rgba(244,163,64,0.06)"/>
      <stop offset="100%" stop-color="rgba(244,163,64,0)"/>
    </radialGradient>

    <!-- Icon glow -->
    <filter id="icon-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text depth -->
    <filter id="text-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#060e18" flood-opacity="0.7"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Noise grain -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
    </filter>

    <!-- Accent bar gradient -->
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4a340"/>
      <stop offset="100%" stop-color="#d08030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0a1628"/>
  <rect width="800" height="200" fill="url(#bg-depth)"/>
  <rect width="800" height="200" fill="url(#sunset-hint)"/>
  <rect width="800" height="200" filter="url(#noise)"/>

  <!-- Flip-flops icon (~128px rendered) -->
  <g transform="translate(52, 36) scale(0.25)">
    <circle cx="256" cy="256" r="270" fill="rgba(244,163,64,0.04)" filter="url(#icon-glow)"/>

