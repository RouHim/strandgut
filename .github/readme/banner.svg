<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- ── Background depth ── -->
    <radialGradient id="bg-depth" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0e2838"/>
      <stop offset="45%" stop-color="#0a1e28"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>

    <radialGradient id="sunset-hint" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="rgba(244,163,64,0.05)"/>
      <stop offset="100%" stop-color="rgba(244,163,64,0)"/>
    </radialGradient>

    <!-- ── Glass panel ── -->
    <linearGradient id="glass-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(180,210,200,0.10)"/>
      <stop offset="100%" stop-color="rgba(180,210,200,0.04)"/>
    </linearGradient>

    <linearGradient id="glass-top-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <linearGradient id="glass-edge-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(244,163,64,0.10)"/>
      <stop offset="12%" stop-color="rgba(244,163,64,0)"/>
    </linearGradient>

    <!-- ── Accent ── -->
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4a340"/>
      <stop offset="100%" stop-color="#d08030"/>
    </linearGradient>

    <!-- ── Filters ── -->
    <filter id="shadow-blur" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="orb-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#0a1628" flood-opacity="0.7"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ── Noise texture ── -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.025"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════
       Background
       ═══════════════════════════════════════════════════════════════ -->
  <rect width="800" height="200" fill="#0a1628"/>
  <rect width="800" height="200" fill="url(#bg-depth)"/>
  <rect width="800" height="200" fill="url(#sunset-hint)"/>
  <rect width="800" height="200" filter="url(#noise)"/>

  <!-- ═══════════════════════════════════════════════════════════════
       Subtle depth lines (ocean layers)
       ═══════════════════════════════════════════════════════════════ -->
  <g stroke="rgba(255,255,255,0.018)" stroke-width="1">
    <line x1="0" y1="55" x2="800" y2="55"/>
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="165" x2="800" y2="165"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       Network constellation (very faint)
       ═══════════════════════════════════════════════════════════════ -->
  <g fill="rgba(255,255,255,0.03)">
    <circle cx="110" cy="45" r="1.5"/>
    <circle cx="155" cy="75" r="2"/>
    <circle cx="135" cy="115" r="1"/>
    <circle cx="95" cy="145" r="1.5"/>
    <circle cx="175" cy="35" r="1"/>
    <circle cx="195" cy="95" r="2"/>
    <circle cx="75" cy="85" r="1.5"/>
    <circle cx="145" cy="155" r="1"/>
    <circle cx="105" cy="25" r="1"/>
    <circle cx="185" cy="135" r="1.5"/>
    <circle cx="65" cy="125" r="1"/>
    <circle cx="165" cy="105" r="1"/>
    <circle cx="125" cy="65" r="2"/>
    <circle cx="85" cy="55" r="1"/>
    <circle cx="205" cy="55" r="1.5"/>
    <circle cx="155" cy="165" r="1"/>
    <circle cx="55" cy="95" r="1.5"/>
    <circle cx="135" cy="135" r="1"/>
    <circle cx="175" cy="15" r="1"/>
    <circle cx="95" cy="175" r="1"/>
    <circle cx="185" cy="85" r="1"/>
    <circle cx="75" cy="35" r="1.5"/>
    <circle cx="125" cy="175" r="1"/>
    <circle cx="165" cy="55" r="1"/>
    <circle cx="105" cy="95" r="1.5"/>
    <!-- A few brighter accent dots -->
    <circle cx="250" cy="50" r="1" fill="rgba(244,163,64,0.06)"/>
    <circle cx="280" cy="160" r="1.5" fill="rgba(244,163,64,0.04)"/>
    <circle cx="320" cy="40" r="1" fill="rgba(244,163,64,0.05)"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       Glassmorphism panel
       ═══════════════════════════════════════════════════════════════ -->
  <!-- Drop shadow -->
  <rect x="258" y="36" width="524" height="136" rx="20" fill="rgba(0,8,16,0.45)" filter="url(#shadow-blur)"/>

  <!-- Main panel body -->
  <rect x="250" y="28" width="540" height="144" rx="20" fill="url(#glass-fill)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Top-edge highlight -->
  <rect x="251" y="29" width="538" height="44" rx="19" fill="url(#glass-top-shine)"/>

  <!-- Left-edge amber glow -->
  <rect x="250" y="28" width="80" height="144" rx="20" fill="url(#glass-edge-amber)"/>

  <!-- Inner border glow -->
  <rect x="250.5" y="28.5" width="539" height="143" rx="19.5" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════════════
       Flip-flops icon
       ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(48, 23) scale(0.3)">
    <!-- Soft amber glow behind badge -->
    <circle cx="256" cy="256" r="266" fill="rgba(244,163,64,0.06)" filter="url(#orb-glow)"/>

    <circle style="fill:#306860;" cx="255.995" cy="255.999" r="255.995"/>
