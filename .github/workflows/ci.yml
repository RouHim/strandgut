name: CI/CD
on:
  push:
  pull_request:
    types:
      - opened
  workflow_dispatch: # allow manual execution

permissions:
  contents: write
  packages: write

env:
  STRANDGUT_CONFIG: /data/config.toml

jobs:
  lint-format:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Run Rust linter
        run: cargo clippy -- -D warnings

  rust-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    env:
      STRANDGUT_CONFIG: ${{ github.workspace }}/e2e-test-config.toml

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Build release binary
        run: cargo build --release

      - name: Run E2E tests
        run: npm test
        working-directory: e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  create-release:
    name: Create release
    needs:
      - lint-format
      - rust-tests
      - e2e-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release dependencies
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/git \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            conventional-changelog-conventionalcommits

      - name: Generate Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          BEFORE_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)

          npx semantic-release

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force
          AFTER_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          if [ -n "$AFTER_TAG" ] && [ "$AFTER_TAG" != "$BEFORE_TAG" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${AFTER_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Build and upload release binaries
    needs: create-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
            name: strandgut-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
            name: strandgut-aarch64-unknown-linux-musl

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/strandgut/strandgut

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary with target name
        run: |
          cp target/${{ matrix.target }}/release/strandgut ${{ matrix.name }}

      - name: Verify binary is statically linked
        run: |
          file ${{ matrix.name }}
          file ${{ matrix.name }} | grep -Eq "statically linked|static-pie linked"
          ldd ${{ matrix.name }} 2>&1 | tee ldd.txt
          grep -Eq "not a dynamic executable|statically linked" ldd.txt

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git ls-remote --tags https://github.com/${{ github.repository }} | grep -o 'refs/tags/v[0-9.]*$' | sort -V | tail -n1 | sed 's|refs/tags/||')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload binary to release
        if: needs.create-release.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: ${{ matrix.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-container:
    name: Build container image
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    needs:
      - lint-format
      - rust-tests
      - e2e-tests
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build ${{ matrix.arch }} image
        run: |
          docker build \
            --platform ${{ matrix.platform }} \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            --tag strandgut-${{ matrix.arch }}:latest \
            -f Containerfile.pipeline .

      # amd64: Setup Node + Playwright for container E2E gate
      - name: Setup Node.js
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install npm dependencies
        if: matrix.arch == 'amd64'
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        if: matrix.arch == 'amd64'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start container for E2E tests
        if: matrix.arch == 'amd64'
        run: |
          docker run -d --name strandgut-e2e -p 13569:13569 --user=0 strandgut-amd64:latest

      - name: Quick health check
        if: matrix.arch == 'amd64'
        run: |
          sleep 3
          echo "=== Container logs after 3s ==="
          docker logs strandgut-e2e
          echo "=== Testing health endpoint ==="
          if ! curl --retry 5 --retry-delay 2 --retry-all-errors http://localhost:13569/api/health; then
            echo "=== Health check failed, dumping full logs ==="
            docker logs strandgut-e2e
            exit 1
          fi

      - name: Run E2E tests against container
        if: matrix.arch == 'amd64'
        run: npm test
        working-directory: e2e
        env:
          STRANDGUT_NO_WEBSERVER: '1'

      - name: Stop E2E container
        if: matrix.arch == 'amd64' && always()
        run: |
          docker stop strandgut-e2e || true
          docker rm strandgut-e2e || true

      - name: Push image to GHCR
        run: |
          docker tag strandgut-${{ matrix.arch }}:latest ghcr.io/rouhim/strandgut:${{ matrix.arch }}-latest
          docker push ghcr.io/rouhim/strandgut:${{ matrix.arch }}-latest

  push-manifest:
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-container
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t ghcr.io/rouhim/strandgut:latest \
            ghcr.io/rouhim/strandgut:amd64-latest \
            ghcr.io/rouhim/strandgut:arm64-latest
