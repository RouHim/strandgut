<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <style>
    .wordmark {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #e8e0d8; }
      .accent { stroke: #f4a340; fill: #f4a340; }
    }
    @media (prefers-color-scheme: light) {
      .wordmark { fill: #2c2420; }
      .accent { stroke: #d08030; fill: #d08030; }
    }
  </style>

  <!-- Stylized wave and orb -->
  <path class="accent" d="M14 38 Q24 28 34 38 Q44 48 54 38" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="accent" cx="70" cy="30" r="10" fill="none" stroke-width="2"/>
  <circle class="accent" cx="70" cy="30" r="3"/>

  <!-- Wordmark -->
  <text x="94" y="36" class="wordmark">Strandgut</text>
</svg>
